<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Cooling - Dashboard</title>
    <!-- Google Fonts: Inter for clean, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        /* Dashboard specific overrides if needed, otherwise rely on style.css */
        body {
            padding: 80px 20px 20px 20px; /* Account for fixed header */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-dash {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            margin-top: 2rem;
        }

        .header-dash h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--color-slate-dark);
        }

        .logout-btn {
            text-decoration: none;
            color: var(--color-danger, #ef4444);
            font-weight: 600;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        @media (min-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--color-white);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: var(--color-slate-dark);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            background-color: #ef4444; /* danger */
        }

        .status-badge.online {
            background-color: #10b981; /* success */
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-btn {
            background-color: var(--color-ice-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            font-family: var(--font-primary);
            font-weight: 500;
        }

        .action-btn:hover {
            background-color: #0284c7;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .telemetry-data {
            font-size: 1.1rem;
            margin: 10px 0;
            color: var(--color-slate-medium);
        }

        .telemetry-value {
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--color-ice-blue);
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header class="header" id="header">
        <div class="container header-container">
            <!-- Logo -->
            <a href="/" class="logo">
                <span class="logo-accent">CCS</span>
                <span class="logo-text">Capital Cooling Solutions</span>
            </a>

            <!-- Desktop Nav -->
            <nav class="nav desktop-only">
                <ul class="nav-list">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li><a href="{{ url_for('dashboard') }}" class="nav-link" style="color: var(--color-ice-blue);">Dashboard</a></li>
                    <li><a href="{{ url_for('logout') }}" class="nav-link">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="header-dash">
        <h1>Capital Cooling Control Panel</h1>
    </div>

    <div class="dashboard-grid">
        <!-- Device Status -->
        <div class="card">
            <h2>Device Status</h2>
            <p>Connection: <span id="conn-status" class="status-badge">Offline</span></p>
            <p id="ping-readout">Ping Latency: -- ms</p>
        </div>

        <!-- Telemetry -->
        <div class="card">
            <h2>Telemetry</h2>
            <div class="telemetry-data">
                Temperature (A0): <br>
                <span id="temp-readout" class="telemetry-value">-- °C</span>
            </div>
        </div>

        <!-- Action Deck -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>Action Deck</h2>

            <div class="action-group" style="flex-direction: row; gap: 15px; flex-wrap: wrap;">
                <button class="action-btn" onclick="sendAction('/api/command/ping')">Ping Arduino</button>
                <button class="action-btn" onclick="sendAction('/api/command/read_sensors')">Read Temperature Now</button>
                <button class="action-btn" style="background-color: #64748b;">Calibrate Zero (Hook)</button>
                <button class="action-btn" style="background-color: #ef4444;">Emergency Stop (Hook)</button>
            </div>

            <div class="slider-container" style="margin-top: 20px;">
                <label for="pwm-slider">Actuator Control (PWM 0-255): <span id="pwm-val-display">0</span></label>
                <input type="range" id="pwm-slider" min="0" max="255" value="0" onchange="sendPWM(this.value)" oninput="document.getElementById('pwm-val-display').innerText = this.value">
            </div>
        </div>
    </div>

    <script>
        async function sendAction(endpoint) {
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                if (!res.ok) console.error("Action failed", res);
            } catch (e) {
                console.error("Error sending action", e);
            }
        }

        async function sendPWM(val) {
            try {
                const res = await fetch('/api/command/pwm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: parseInt(val) })
                });
                if (!res.ok) console.error("PWM action failed", res);
            } catch (e) {
                console.error("Error sending PWM", e);
            }
        }

        // Poll telemetry data every 2 seconds
        async function fetchTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                if (res.ok) {
                    const data = await res.json();

                    const statusBadge = document.getElementById('conn-status');
                    if (data.status === 'online') {
                        statusBadge.textContent = 'Online';
                        statusBadge.classList.add('online');
                    } else {
                        statusBadge.textContent = 'Offline';
                        statusBadge.classList.remove('online');
                    }

                    if (data.ping_latency_ms !== null) {
                        document.getElementById('ping-readout').textContent = `Ping Latency: ${data.ping_latency_ms} ms`;
                    }

                    if (data.temp_c !== null) {
                        document.getElementById('temp-readout').textContent = `${data.temp_c} °C`;
                    }
                }
            } catch (e) {
                console.error("Error fetching telemetry", e);
            }
        }

        setInterval(fetchTelemetry, 2000);
        fetchTelemetry(); // initial fetch
    </script>
</body>
</html>
